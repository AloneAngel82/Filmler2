<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hemen Üye Ol!</title>
</head>
<body>
    <h1>Lütfen formu eksiksiz doldurunuz.</h1>

    <hr>

    <form action="#" method="post">
        <h2>Hesap Bilgileriniz</h2>

        <table>
            <tr>
                <td width="120px">
                    <label for="username">Kullanıcı adı:</label>
                </td>
                <td></td>
                <td>
                    <input type="text" id="username" name="username">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="e-posta">E-posta:</label>
                </td>
                <td></td>
                <td>
                    <input type="email" id="e-posta" name="e-posta">
                </td>
            </tr>

            <tr>
                <td><label for="parola">Parola:</label></td>
                <td></td>
                <td>
                    <input type="password" id="parola" name="parola">
                </td>
            </tr>
        </table>

        <h2>Kişisel Bilgileriniz</h2>

        <table>
            <tr>
                <td width="120px"><label for="name">Adınız:</label></td>
                <td></td>
                <td><input type="text" id="name" name="name"></td>
            </tr>

            <tr>
                <td><label for="surname">Soyadınız:</label></td>
                <td></td>
                <td><input type="text" id="surname" name="surname"></td>
            </tr>

            <tr>
                <td><label for="sehir">Şehir:</label></td>
                <td></td>
                <td>
                    <select id="sehir" name="sehir">
                        <option value="">Seçiniz</option>
                        <option value="istanbul">İstanbul</option>
                        <option value="izmir">İzmir</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><label>Cinsiyet:</label></td>
                <td></td>
                <td>
                    <input type="radio" name="cinsiyet" value="kadin">Kadın
                    <input type="radio" name="cinsiyet" value="erkek">Erkek
                </td>
            </tr>

            <tr>
                <td colspan="2">
                   <button type="submit">Kaydet</button>
                   <button type="reset">Temizle</button>
              </td>
                <td>
                    
                </td>
             <td></td>
            </tr>
        </table>
    </form>

    <br>
    <a href="en-iyi-filmler.html">Anasayfaya Dön</a>
</body>
</html>
